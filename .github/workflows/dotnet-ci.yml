name: .NET 10 CI

on:
  push:
    paths:
      - ".github/workflows/dotnet-ci.yml"
      - ".github/workflows/wasm-browser-e2e.yml"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "global.json"
      - "ChapterTool.slnx"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "scripts/**"
      - "packages/chaptertool/**"
      - "src/ChapterTool.Avalonia.UI/Localization/Resources/Locales/**"
  pull_request:
    paths:
      - ".github/workflows/dotnet-ci.yml"
      - ".github/workflows/wasm-browser-e2e.yml"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "global.json"
      - "ChapterTool.slnx"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "scripts/**"
      - "packages/chaptertool/**"
      - "src/ChapterTool.Avalonia.UI/Localization/Resources/Locales/**"

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-browser-e2e:
    name: WASM browser checks
    uses: ./.github/workflows/wasm-browser-e2e.yml

  resources:
    name: Resources and scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Sync locked Python tools
        run: python3 scripts/check-ci.py --stage resources --step sync-locked-python-tools
      - name: Verify localization resources
        run: python3 scripts/check-ci.py --stage resources --step verify-localization-resources
      - name: Lint Python scripts
        run: python3 scripts/check-ci.py --stage resources --step lint-python-scripts
      - name: Test CI runner
        run: python3 scripts/check-ci.py --stage resources --step test-ci-runner
      - name: Validate PowerShell publish script
        run: python3 scripts/check-ci.py --stage resources --step validate-powershell-publish-script

  build-test:
    name: .NET build, tests, and NuGet
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets', 'Directory.Packages.props', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Install external tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mkvtoolnix

      - name: Restore solution
        run: python3 scripts/check-ci.py --stage dotnet --step restore
      - name: Build Release
        run: python3 scripts/check-ci.py --stage dotnet --step build-release
      - name: Test Avalonia Headless
        run: python3 scripts/check-ci.py --stage dotnet --step test-chaptertool-avalonia-headless-tests
      - name: Test Avalonia ViewModels and services
        run: python3 scripts/check-ci.py --stage dotnet --step test-chaptertool-avalonia-tests
      - name: Test CLI
        run: python3 scripts/check-ci.py --stage dotnet --step test-chaptertool-commandline-tests
      - name: Test Core
        run: python3 scripts/check-ci.py --stage dotnet --step test-chaptertool-core-tests
      - name: Test WASM workspace
        run: python3 scripts/check-ci.py --stage dotnet --step test-chaptertool-wasm-tests
      - name: Test Infrastructure integrations
        run: python3 scripts/check-ci.py --stage dotnet --step test-chaptertool-infrastructure-tests
      - name: Pack Core NuGet
        run: python3 scripts/check-ci.py --stage dotnet --step pack-chaptertool-core
      - name: Pack CLI NuGet
        run: python3 scripts/check-ci.py --stage dotnet --step pack-chaptertool-commandline

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v7
        with:
          name: ChapterTool-Core-nuget
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

      - name: Upload CLI NuGet artifact
        uses: actions/upload-artifact@v7
        with:
          name: ChapterTool-Cli-nuget
          path: |
            artifacts/cli-nuget/*.nupkg
            artifacts/cli-nuget/*.snupkg
          if-no-files-found: error

  pack-dotnet:
    name: Pack Avalonia (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: ubuntu-24.04
            artifact-path: artifacts/publish/framework-dependent/win-x64
          - runtime: linux-x64
            os: ubuntu-24.04
            artifact-path: artifacts/publish/framework-dependent/linux-x64
          - runtime: osx-arm64
            os: macos-latest
            artifact-path: artifacts/publish/framework-dependent/osx-arm64/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets', 'Directory.Packages.props', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore desktop runtime
        run: python3 scripts/check-ci.py --stage pack-desktop --runtime ${{ matrix.runtime }} --step restore-desktop-${{ matrix.runtime }}
      - name: Publish and validate desktop artifact
        run: python3 scripts/check-ci.py --stage pack-desktop --runtime ${{ matrix.runtime }} --step publish-desktop-${{ matrix.runtime }}

      - name: Upload Avalonia artifact
        uses: actions/upload-artifact@v7
        with:
          name: ChapterTool-Avalonia-${{ matrix.runtime }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  pack-nodejs:
    name: Node.js build, tests, and package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: packages/chaptertool/package-lock.json

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets', 'Directory.Packages.props', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Install .NET wasm-tools workload
        run: dotnet workload install wasm-tools
      - name: Install npm dependencies
        run: python3 scripts/check-ci.py --stage node --step install-npm-dependencies
      - name: Build Node.js package
        run: python3 scripts/check-ci.py --stage node --step build-node-js-package
      - name: Type check Node.js package
        run: python3 scripts/check-ci.py --stage node --step type-check-node-js-package
      - name: Test built Node.js package
        run: python3 scripts/check-ci.py --stage node --step test-built-node-js-package

      - name: Pack and verify npm tarball
        run: python3 scripts/check-ci.py --stage pack-node

      - name: Upload npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: ChapterTool-node-package
          path: artifacts/npm/*.tgz
          if-no-files-found: error
