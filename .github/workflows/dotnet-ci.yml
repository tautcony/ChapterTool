name: .NET 10 CI

on:
  push:
    paths:
      - ".github/workflows/dotnet-ci.yml"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "global.json"
      - "ChapterTool.slnx"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "scripts/**"
      - "packages/chaptertool/**"
      - "src/ChapterTool.Avalonia.UI/Localization/Resources/Locales/**"
  pull_request:
    paths:
      - ".github/workflows/dotnet-ci.yml"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "global.json"
      - "ChapterTool.slnx"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "scripts/**"
      - "packages/chaptertool/**"
      - "src/ChapterTool.Avalonia.UI/Localization/Resources/Locales/**"

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync locked Python tools
        run: uv sync --locked --no-build --project scripts

      - name: Verify localization resources
        run: uv run --locked --no-build --project scripts scripts/axaml-to-json.py --check

      - name: Lint Python scripts
        run: uv run --locked --no-build --project scripts ruff check scripts/

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: packages/chaptertool/package-lock.json

      - name: Install npm dependencies
        working-directory: packages/chaptertool
        run: npm ci --ignore-scripts

      - name: Restore
        run: dotnet restore ChapterTool.slnx

      - name: Build
        run: dotnet build ChapterTool.slnx --configuration Release --no-restore

      - name: Build Node.js package
        working-directory: packages/chaptertool
        run: npm run build

      - name: Validate PowerShell publish script
        shell: pwsh
        run: |
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/publish.ps1'),
            [ref]$null,
            [ref]$null)

      - name: Pack ChapterTool.Core
        run: dotnet pack src/ChapterTool.Core/ChapterTool.Core.csproj --configuration Release --no-build --no-restore --output artifacts/nuget /p:ContinuousIntegrationBuild=true

      - name: Pack ChapterTool CLI
        run: dotnet pack src/ChapterTool.CommandLine/ChapterTool.CommandLine.csproj --configuration Release --no-build --no-restore --output artifacts/cli-nuget /p:ContinuousIntegrationBuild=true

      - name: Install external tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mkvtoolnix

      - name: Test .NET
        run: dotnet test ChapterTool.slnx --configuration Release --no-build --no-restore --timeout 10m

      - name: Test Node.js package
        working-directory: packages/chaptertool
        run: npm run typecheck && npm run test:built

      - name: Upload Node.js build output
        uses: actions/upload-artifact@v7
        with:
          name: ChapterTool-node-dist
          path: packages/chaptertool/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v7
        with:
          name: ChapterTool-Core-nuget
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error

      - name: Upload CLI NuGet artifact
        uses: actions/upload-artifact@v7
        with:
          name: ChapterTool-Cli-nuget
          path: |
            artifacts/cli-nuget/*.nupkg
            artifacts/cli-nuget/*.snupkg
          if-no-files-found: error

  wasm-browser-e2e:
    name: WASM browser E2E (Chromium)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: tests/ChapterTool.Wasm.E2E/package-lock.json

      - name: Restore and publish WASM
        run: |
          dotnet restore src/ChapterTool.Wasm/ChapterTool.Wasm.csproj
          dotnet publish src/ChapterTool.Wasm/ChapterTool.Wasm.csproj \
            --configuration Release --no-restore --output artifacts/wasm-e2e/publish

      - name: Install E2E dependencies
        working-directory: tests/ChapterTool.Wasm.E2E
        run: npm ci

      - name: Prepare Pages-shaped site
        working-directory: tests/ChapterTool.Wasm.E2E
        run: npm run prepare:site -- --publish ../../artifacts/wasm-e2e/publish/wwwroot

      - name: Type check
        working-directory: tests/ChapterTool.Wasm.E2E
        run: npm run typecheck

      - name: Install Chromium
        working-directory: tests/ChapterTool.Wasm.E2E
        run: npm exec -- playwright install --with-deps chromium

      - name: Run Chromium E2E suite
        working-directory: tests/ChapterTool.Wasm.E2E
        run: npm run test:e2e -- --project=chromium

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-browser-e2e-chromium
          path: artifacts/wasm-e2e/
          if-no-files-found: warn
          retention-days: 14

  pack-dotnet:
    needs: build-test
    name: Pack Avalonia (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: ubuntu-24.04
            artifact-path: artifacts/publish/framework-dependent/win-x64
          - runtime: linux-x64
            os: ubuntu-24.04
            artifact-path: artifacts/publish/framework-dependent/linux-x64
          - runtime: osx-arm64
            os: macos-latest
            artifact-path: artifacts/publish/framework-dependent/osx-arm64/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET projects
        run: |
          dotnet restore src/ChapterTool.Avalonia/ChapterTool.Avalonia.csproj --runtime ${{ matrix.runtime }}

      - name: Publish Avalonia
        run: >-
          ./scripts/publish.sh
          -Configuration Release
          -Runtime ${{ matrix.runtime }}
          -SelfContained=false
          -NoRestore
          -PublishSingleFile

      - name: Upload Avalonia artifact
        uses: actions/upload-artifact@v7
        with:
          name: ChapterTool-Avalonia-${{ matrix.runtime }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  pack-nodejs:
    needs: build-test
    name: Pack Node.js package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Download Node.js build output
        uses: actions/download-artifact@v8
        with:
          name: ChapterTool-node-dist
          path: packages/chaptertool/dist

      - name: Pack and verify npm tarball
        working-directory: packages/chaptertool
        run: npm run pack:verify

      - name: Upload npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: ChapterTool-node-package
          path: artifacts/npm/*.tgz
          if-no-files-found: error
