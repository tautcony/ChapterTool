name: WASM browser acceptance

on:
  workflow_call:
    inputs:
      suite:
        description: Browser suite to run
        type: string
        default: pr

jobs:
  prepare-site:
    name: Publish and prepare WASM site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: tests/ChapterTool.Wasm.E2E/package-lock.json

      - name: Restore WASM
        run: python3 scripts/check-ci.py --stage browser --step restore-wasm
      - name: Publish Release WASM
        run: python3 scripts/check-ci.py --stage browser --step publish-release-wasm
      - name: Install browser test dependencies
        run: python3 scripts/check-ci.py --stage browser --step install-browser-test-dependencies
      - name: Prepare Pages-shaped site
        run: python3 scripts/check-ci.py --stage browser --step prepare-pages-shaped-site
      - name: Type check browser tests
        run: python3 scripts/check-ci.py --stage browser --step type-check-browser-tests
      - name: Upload prepared site
        uses: actions/upload-artifact@v7
        with:
          name: wasm-prepared-site
          path: artifacts/wasm-e2e/site/
          if-no-files-found: error
          retention-days: 14

  browser-acceptance:
    name: Browser workflows (${{ matrix.engine }})
    needs: prepare-site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON((inputs.suite == 'full') && '["chromium","firefox","webkit"]' || '["chromium","webkit"]') }}
    env:
      BROWSER_SUITE: ${{ (inputs.suite == 'full') && 'full' || 'pr' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: tests/ChapterTool.Wasm.E2E/package-lock.json
      - name: Download prepared site
        uses: actions/download-artifact@v8
        with:
          name: wasm-prepared-site
          path: artifacts/wasm-e2e/site/
      - name: Install browser test dependencies
        run: python3 scripts/check-ci.py --stage browser --step install-browser-test-dependencies
      - name: Install ${{ matrix.engine }}
        run: python3 scripts/check-ci.py --stage browser --browser-suite "$BROWSER_SUITE" --browser-engine ${{ matrix.engine }} --install-browser-deps --step install-browser-engines
      - name: Run Chromium workflows
        if: env.BROWSER_SUITE == 'pr' && matrix.engine == 'chromium'
        run: python3 scripts/check-ci.py --stage browser --browser-engine chromium --step run-chromium-e2e
      - name: Run WebKit modal and editing regressions
        if: env.BROWSER_SUITE == 'pr' && matrix.engine == 'webkit'
        run: python3 scripts/check-ci.py --stage browser --browser-engine webkit --step run-webkit-regressions
      - name: Run full ${{ matrix.engine }} acceptance without retries
        if: inputs.suite == 'full'
        run: python3 scripts/check-ci.py --stage browser --browser-suite full --browser-engine ${{ matrix.engine }} --step run-full-browser-acceptance

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-browser-acceptance-${{ matrix.engine }}
          path: |
            artifacts/wasm-e2e/report*/
            artifacts/wasm-e2e/results*/
            artifacts/wasm-e2e/*.xml
          if-no-files-found: warn
          retention-days: 14
