name: WASM browser acceptance

on:
  workflow_call:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: Generate Linux screenshot baselines for review
        type: boolean
        default: false

concurrency:
  group: wasm-browser-acceptance-${{ github.ref }}-${{ inputs.update_visual_snapshots && 'baselines' || 'checks' }}
  cancel-in-progress: true

jobs:
  prepare-site:
    name: Publish and prepare WASM site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: tests/ChapterTool.Wasm.E2E/package-lock.json

      - name: Restore WASM
        run: python3 scripts/check-ci.py --stage browser --step restore-wasm
      - name: Publish Release WASM
        run: python3 scripts/check-ci.py --stage browser --step publish-release-wasm
      - name: Install browser test dependencies
        run: python3 scripts/check-ci.py --stage browser --step install-browser-test-dependencies
      - name: Prepare Pages-shaped site
        run: python3 scripts/check-ci.py --stage browser --step prepare-pages-shaped-site
      - name: Type check browser tests
        run: python3 scripts/check-ci.py --stage browser --step type-check-browser-tests
      - name: Upload prepared site
        uses: actions/upload-artifact@v7
        with:
          name: wasm-prepared-site
          path: artifacts/wasm-e2e/site/
          if-no-files-found: error
          retention-days: 1

  browser-acceptance:
    name: Browser acceptance (${{ matrix.engine }})
    if: github.event_name != 'workflow_dispatch' || !inputs.update_visual_snapshots
    needs: prepare-site
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["chromium","firefox","webkit"]' || '["chromium","webkit"]') }}
    env:
      BROWSER_SUITE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'pr' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: tests/ChapterTool.Wasm.E2E/package-lock.json
      - name: Download prepared site
        uses: actions/download-artifact@v8
        with:
          name: wasm-prepared-site
          path: artifacts/wasm-e2e/site/
      - name: Install browser test dependencies
        run: python3 scripts/check-ci.py --stage browser --step install-browser-test-dependencies
      - name: Install ${{ matrix.engine }}
        run: python3 scripts/check-ci.py --stage browser --browser-suite "$BROWSER_SUITE" --browser-engine ${{ matrix.engine }} --install-browser-deps --step install-browser-engines
      - name: Run Chromium workflows
        if: env.BROWSER_SUITE == 'pr' && matrix.engine == 'chromium'
        run: python3 scripts/check-ci.py --stage browser --browser-engine chromium --step run-chromium-e2e
      - name: Run WebKit modal and editing regressions
        if: env.BROWSER_SUITE == 'pr' && matrix.engine == 'webkit'
        run: python3 scripts/check-ci.py --stage browser --browser-engine webkit --step run-webkit-regressions
      - name: Run full ${{ matrix.engine }} acceptance without retries
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check-ci.py --stage browser --browser-suite full --browser-engine ${{ matrix.engine }} --step run-full-browser-acceptance

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-browser-acceptance-${{ matrix.engine }}
          path: |
            artifacts/wasm-e2e/report*/
            artifacts/wasm-e2e/results*/
            artifacts/wasm-e2e/*.xml
          if-no-files-found: warn
          retention-days: 14

  visual-acceptance:
    name: Linux screenshot baselines
    needs: prepare-site
    runs-on: ubuntu-24.04
    # Preserve the existing Debian screenshot environment and image digest.
    container: node:22-slim@sha256:7af03b14a13c8cdd38e45058fd957bf00a72bbe17feac43b1c15a689c029c732
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Python
        run: |
          apt-get update
          apt-get install -y python3
      - name: Download prepared site
        uses: actions/download-artifact@v8
        with:
          name: wasm-prepared-site
          path: artifacts/wasm-e2e/site/
      - name: Install visual test dependencies
        run: python3 scripts/check-ci.py --stage visual --step install-visual-test-dependencies
      - name: Install Chromium and system dependencies
        run: python3 scripts/check-ci.py --stage visual --install-browser-deps --step install-chromium
      - name: Compare Linux screenshot baselines
        if: ${{ !inputs.update_visual_snapshots && github.event_name != 'push' }}
        run: python3 scripts/check-ci.py --stage visual --step compare-linux-screenshot-baselines
      - name: Generate Linux screenshot baselines
        if: ${{ inputs.update_visual_snapshots || github.event_name == 'push' }}
        run: python3 scripts/check-ci.py --stage visual --step compare-linux-screenshot-baselines --update-visual-snapshots
      - name: Upload generated Linux baselines for review
        if: ${{ inputs.update_visual_snapshots || github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: wasm-linux-baselines
          path: tests/ChapterTool.Wasm.E2E/specs/layout.spec.ts-snapshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload visual diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-visual-acceptance
          path: |
            artifacts/wasm-e2e/report*/
            artifacts/wasm-e2e/results*/
            artifacts/wasm-e2e/*.xml
          if-no-files-found: warn
          retention-days: 14
