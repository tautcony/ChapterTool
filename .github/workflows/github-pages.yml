name: Deploy WASM (GitHub Pages)

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tested site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download tested site
        uses: actions/download-artifact@v8
        with:
          name: wasm-prepared-site
          path: artifacts/wasm-e2e/site/
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/wasm-e2e/site/ChapterTool
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
