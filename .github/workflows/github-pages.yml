# Deploy the Blazor WebAssembly app to GitHub Pages.
# Site URL (project pages): https://<owner>.github.io/<repo>/
#
# One-time repo settings:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# Optional: Settings → Actions → General → allow SteveSandersonMS/ghaction-rewrite-base-href
name: Deploy WASM (GitHub Pages)

on:
  push:
    branches:
      - master
    paths:
      - "src/ChapterTool.Wasm/**"
      - "src/ChapterTool.Core/**"
      - "src/ChapterTool.Contracts/**"
      - "src/ChapterTool.Avalonia.UI/Localization/Resources/Locales/**"
      - "tests/ChapterTool.Wasm.E2E/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PROJECT: src/ChapterTool.Wasm/ChapterTool.Wasm.csproj
  PUBLISH_DIR: src/ChapterTool.Wasm/bin/Release/net10.0/publish/wwwroot
  E2E_SITE_DIR: artifacts/wasm-e2e/site/ChapterTool

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: tests/ChapterTool.Wasm.E2E/package-lock.json

      - name: Publish Blazor WASM app
        run: |
          set -euo pipefail
          dotnet publish "${{ env.PROJECT }}" \
            --configuration Release \
            --nologo

      - name: Install E2E dependencies
        working-directory: tests/ChapterTool.Wasm.E2E
        run: npm ci

      - name: Prepare GitHub Pages site
        working-directory: tests/ChapterTool.Wasm.E2E
        run: npm run prepare:site -- --publish ../../${{ env.PUBLISH_DIR }}

      - name: Install Chromium
        working-directory: tests/ChapterTool.Wasm.E2E
        run: npm exec -- playwright install --with-deps chromium

      - name: Test deployment smoke workflows
        working-directory: tests/ChapterTool.Wasm.E2E
        run: npm run test:e2e -- --project=chromium --grep @smoke

      - name: Verify published site layout
        run: |
          set -euo pipefail
          publish_dir="${{ env.E2E_SITE_DIR }}"
          repo_name="${{ github.event.repository.name }}"

          # Project Pages base href must be present on both entry documents.
          grep -F "href=\"/${repo_name}/\"" "${publish_dir}/index.html"
          grep -F "href=\"/${repo_name}/\"" "${publish_dir}/404.html"

          test -f "${publish_dir}/.nojekyll"
          test -f "${publish_dir}/404.html"
          test -f "${publish_dir}/js/download.js"
          test -f "${publish_dir}/css/app.css"
          test -d "${publish_dir}/_framework"

          # Critical Blazor boot assets (fingerprinted names vary by publish).
          # Do not use `ls | head` under pipefail: GNU ls exits 2 on SIGPIPE.
          shopt -s nullglob
          blazor_js=("${publish_dir}/_framework"/blazor.webassembly*.js)
          wasm_binary=("${publish_dir}/_framework"/ChapterTool.Wasm*.wasm)
          test "${#blazor_js[@]}" -ge 1
          test "${#wasm_binary[@]}" -ge 1
          framework_count="$(find "${publish_dir}/_framework" -type f | wc -l | tr -d ' ')"
          test "${framework_count}" -ge 10
          echo "framework_files=${framework_count}"
          echo "blazor_js=${blazor_js[0]##*/}"
          echo "wasm_binary=${wasm_binary[0]##*/}"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.E2E_SITE_DIR }}

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pages-browser-e2e
          path: artifacts/wasm-e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
