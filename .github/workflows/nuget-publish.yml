name: Publish to NuGet

on:
  workflow_run:
    workflows:
      - .NET 10 CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose successful CI packages should be published
        required: true
        type: string

jobs:
  publish-nuget:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          startsWith(github.event.workflow_run.head_branch, 'v')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nuget
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    permissions:
      id-token: write
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Resolve tested CI run
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/ci/resolve-ci-run.py --tag "$RELEASE_TAG"
      - name: Download tested Core package
        uses: actions/download-artifact@v8
        with:
          name: ChapterTool-Core-nuget
          run-id: ${{ steps.ci-run.outputs.run-id }}
          github-token: ${{ github.token }}
          path: artifacts/nuget
      - name: Download tested CLI package
        uses: actions/download-artifact@v8
        with:
          name: ChapterTool-Cli-nuget
          run-id: ${{ steps.ci-run.outputs.run-id }}
          github-token: ${{ github.token }}
          path: artifacts/cli-nuget
      - name: Verify release package versions
        run: python3 scripts/ci/verify-nuget.py --metadata-only --expected-version "${RELEASE_TAG#v}"
      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push tested packages and symbols to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/nuget/*.nupkg artifacts/cli-nuget/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
      - name: Push tested packages to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in artifacts/nuget/*.nupkg artifacts/cli-nuget/*.nupkg; do
            dotnet nuget push "$package" --api-key "$GITHUB_TOKEN" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
          done
