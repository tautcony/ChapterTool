name: Publish to npm

on:
  workflow_run:
    workflows:
      - .NET 10 CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose successful CI npm artifact should be published
        required: true
        type: string

jobs:
  publish-npm:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          startsWith(github.event.workflow_run.head_branch, 'v')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Install npm Trusted Publishing client
        run: npm install --global --ignore-scripts npm@11.5.1

      - name: Resolve tested CI run
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/ci/resolve-ci-run.py --tag "$RELEASE_TAG"

      - name: Download tested npm artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.ci-run.outputs.run-id }}
        run: |
          mkdir -p artifacts/npm
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name ChapterTool-node-package \
            --dir artifacts/npm

          shopt -s nullglob
          archives=(artifacts/npm/*.tgz)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one npm tarball in the CI artifact" >&2
            exit 1
          fi

          package_version="$(node -p "require('./packages/chaptertool/package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag $RELEASE_TAG does not match npm package version $package_version" >&2
            exit 1
          fi

          archive_version="$(basename "${archives[0]}" | sed -E 's/^chaptertool-node-(.+)\.tgz$/\1/')"
          if [[ "$archive_version" != "$package_version" ]]; then
            echo "CI artifact version $archive_version does not match npm package version $package_version" >&2
            exit 1
          fi

      - name: Publish package to npm
        run: npm publish artifacts/npm/*.tgz --access public
