[project]
name = "chaptertool-scripts"
version = "0.1.0"
description = "Repository utility scripts for ChapterTool"
requires-python = ">=3.8"
dependencies = [
    "defusedxml>=0.7",
    "fonttools>=4.44",
]

[project.scripts]
subset-shortcut-font = "command:subset_shortcut_font"
check-shortcut-font = "command:check_shortcut_font"
lint-scripts = "command:lint_scripts"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["command"]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.ruff]
# Keep cyclomatic complexity under 16 (CA1502 parity with CodeMetricsConfig.txt).
extend-exclude = [".venv"]

[tool.ruff.lint]
# C901: cyclomatic complexity; E701-E703: one statement per line.
select = ["C901", "E701", "E702", "E703"]

[tool.ruff.lint.mccabe]
# C901 flags functions whose complexity exceeds this value; 15 rejects 16 and above.
max-complexity = 15
